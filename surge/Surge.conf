美国 = smart, 占位节点, policy-regex-filter=(🇺🇸|美国|美國|美西|美东|美南|美北|洛杉矶|旧金山|圣何塞|西雅图|芝加哥|达拉斯|亚特兰大|硅谷|拉斯维加斯|波特兰|俄勒冈|凤凰城|费利蒙|圣克拉拉|United States|\bUSA\b|\bUS[-_ ]), tolerance=50, include-other-group=机场合集, hidden=1, include-all-proxies=0, icon-url=EMOJI::🇺🇸
