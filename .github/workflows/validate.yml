name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse YAML
        run: ruby -ryaml -e 'ARGV.each { |path| YAML.load_file(path) }' mihomo/*.yaml egern/egern.yaml rules/egern/*.yaml
      - name: Check published profiles match the source
        run: |
          python3 scripts/generate.py
          git diff --exit-code
      - name: Check public credentials
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          pattern = re.compile(r'psk=|ca-p12\s*=\s*\S+|ca-passphrase\s*=\s*\S+|sub\.store/download|http-api\s*=|external-controller-access\s*=')
          matches = [str(path) for folder in ['surge', 'loon', 'mihomo', 'shadowrocket', 'quantumultx', 'egern']
                     for path in Path(folder).rglob('*') if path.is_file() and pattern.search(path.read_text())]
          if matches:
              raise SystemExit('Credentials found in: ' + ', '.join(matches))
          print('Public credential scan passed')
          PY
      - name: Install Mihomo
        run: |
          curl -fsSL https://github.com/MetaCubeX/mihomo/releases/download/v1.19.33/mihomo-linux-amd64-v1.19.33.gz -o /tmp/mihomo.gz
          gzip -d /tmp/mihomo.gz
          chmod +x /tmp/mihomo
      - name: Check Mihomo with local rule files
        run: python3 scripts/check-native.py /tmp/mihomo
