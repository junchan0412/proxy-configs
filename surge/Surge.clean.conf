# 区域策略组
新加坡 = smart, policy-regex-filter=(🇸🇬|新加坡|Singapore|\bSG\b|SGP), url=http://cp.cloudflare.com/generate_204, interval=600, tolerance=100, include-all-proxies=0, hidden=1, no-alert=1, icon-url=EMOJI::🇸🇬
