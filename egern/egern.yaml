# Egern 原生 YAML 配置（由 根配置/Surge源配置.conf 按 Egern 原生语法映射生成）。
# 不含节点凭据、订阅链接（订阅池为占位 URL）、控制接口与证书材料。
# 结构参考 根配置/Egern/Head.yaml + Provider/；策略组与分流顺序与 Surge 源配置一致。
ipv6: false
http_port: 8888
socks_port: 8889
allow_external_connections: true
hijack_dns:
- 8.8.8.8:53
- 8.8.4.4:53
- 1.1.1.1:53
- 1.0.0.1:53
- 45.14.70.14:53
geoip_db_url: https://fastly.jsdelivr.net/gh/Masaiki/GeoIP2-CN/raw/refs/heads@release/Country.mmdb
proxy_latency_test_url: http://cp.cloudflare.com/generate_204
direct_latency_test_url: http://connectivitycheck.gstatic.com/generate_204
udp_latency_test_url: apple.com@64.6.64.6
compat_route: false
include_all_networks: false
vif_excluded_routes:
- 0.0.0.0/8
- 10.0.0.0/8
- 17.0.0.0/8
- 100.64.0.0/10
- 127.0.0.0/8
- 169.254.0.0/16
- 172.16.0.0/12
- 192.0.0.0/24
- 192.0.2.0/24
- 192.168.0.0/16
- 192.88.99.0/24
- 198.18.0.0/15
- 198.51.100.0/24
- 203.0.113.0/24
- 224.0.0.0/4
- 240.0.0.0/4
- 255.255.255.255/32
real_ip_domains:
- '*.msftncsi.com'
- '*.msftconnecttest.com'
- dns.msftncsi.com
- '*.stun.playstation.net'
- 'xbox.*.microsoft.com'
- '*.xboxlive.com'
- '*.srv.nintendo.net'
- '*.stun.twilio.com'
- '*.turn.twilio.com'
- 'time.*.com'
- 'time.*.gov'
- 'time.*.edu.cn'
- 'time.*.apple.com'
- 'time?.*.com'
- 'ntp.*.com'
- 'ntp?.*.com'
- '*.time.edu.cn'
- '*.ntp.org.cn'
- '*.pool.ntp.org'
- 'time*.cloud.tencent.com'
- 'ntp?.aliyun.com'

