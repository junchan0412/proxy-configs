      value: Alibaba
  - domain_wildcard:
      match: '*.alipay.com.cn'
      value: Alibaba
  - domain_wildcard:
      match: '*.alipaydns.com'
      value: Alibaba
  - domain_wildcard:
      match: '*.alicdn.com'
      value: Alibaba
  - domain_wildcard:
      match: '*.aliyun.com'
      value: Alibaba
  - domain_wildcard:
