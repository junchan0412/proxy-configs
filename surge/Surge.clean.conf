韩国 = smart, policy-regex-filter=(🇰🇷|韩国|韓國|首尔|首爾|\bKR\b|Korea), url=http://cp.cloudflare.com/generate_204, interval=600, tolerance=100, include-all-proxies=0, hidden=1, no-alert=1, icon-url=EMOJI::🇰🇷
美国 = smart, policy-regex-filter=(🇺🇸|美国|美國|美西|美东|美南|美北|洛杉矶|旧金山|圣何塞|西雅图|芝加哥|达拉斯|亚特兰大|硅谷|拉斯维加斯|波特兰|俄勒冈|凤凰城|费利蒙|圣克拉拉|United States|\bUSA\b|\bUS[-_ ]), url=http://cp.cloudflare.com/generate_204, interval=600, tolerance=100, include-all-proxies=0, hidden=1, no-alert=1, icon-url=EMOJI::🇺🇸
