dns-server = https://223.5.5.5/dns-query, https://1.12.12.12/dns-query, https://120.53.53.53/dns-query
skip-proxy = localhost, *.local
hijack-dns = *:53
udp-policy-not-supported-behaviour = REJECT

[Proxy]
