    policy: REJECT
- rule_set:
    match: 'https://ruleset.skk.moe/List/ip/stream.conf'
    policy: PROXY

# 10. GeoIP 兜底（依赖完整 Country MMDB）
- geoip:
    match: CN
    policy: DIRECT
    no_resolve: true
- geoip:
    match: SG
    policy: 新加坡
    no_resolve: true
- geoip:
    match: TW
    policy: 台湾
    no_resolve: true
- geoip:
    match: HK
    policy: 香港
    no_resolve: true
- geoip:
    match: JP
    policy: 日本
    no_resolve: true
- geoip:
    match: KR
    policy: 韩国
    no_resolve: true
- geoip:
    match: US
    policy: 美国
    no_resolve: true

# 11. 最终兜底
# dns-failed 时进入 FINAL 组（PROXY/DIRECT），便于观察与手动切换
- default:
    policy: FINAL



mitm:
  hostnames:
    includes:
    - g.cn
    - www.g.cn
    - google.cn
