# Egern 可复用干净配置模板（Surge 兼容语法，可直接导入 Egern）。
# 不含节点凭据、订阅链接、本机路径、证书材料或 API 口令。
# 在 Egern 内添加自己的节点/订阅后，地区组会自动按名称归类。
#
# 策略组与分流意图和 surge/Surge.clean.conf 保持一致：
# 先处理拦截/局域网/iCloud/Pre-AI/AI，再分流国内服务、游戏/测速、
# Apple/Microsoft/国际基础服务、国际社媒、流媒体，最后通用海外兜底。

[General]
loglevel = warning
ipv6 = false
compatibility-mode = 1
skip-proxy = localhost, *.local, *.ts.net, captive.apple.com, guzzoni.apple.com, 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 192.88.99.0/24, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4, 255.255.255.255/32
exclude-simple-hostnames = true

dns-server = 223.5.5.5, 119.29.29.29
encrypted-dns-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query, https://cloudflare-dns.com/dns-query
hijack-dns = 8.8.8.8:53, 8.8.4.4:53, 1.1.1.1:53, 1.0.0.1:53
encrypted-dns-follow-outbound-mode = true

internet-test-url = http://cp.cloudflare.com/generate_204
proxy-test-url = http://cp.cloudflare.com/generate_204
test-timeout = 5

show-error-page-for-reject = true
geoip-maxmind-url = https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb

[Proxy]
# 在 Egern 内添加节点，或在此填写后导入。

[Proxy Group]
# 入口策略组（地区组用 url-test + policy-regex-filter 自动归类订阅节点）
PROXY = select, Auto, 香港, 台湾, 新加坡, 日本, 美国, 韩国, 英国
Auto = url-test, url=http://cp.cloudflare.com/generate_204, interval=600, tolerance=100
FINAL = select, PROXY, DIRECT

# 业务策略组
国际基础服务 = select, 新加坡, 美国, PROXY, DIRECT
AI = select, 台湾, 美国, 新加坡, PROXY
国际社媒 = select, 香港, 新加坡, 美国, 台湾, 日本, PROXY
Game = select, 香港, 日本, 美国, 台湾, 新加坡, 韩国, PROXY, DIRECT
SpeedTest = select, 香港, 新加坡, 美国, DIRECT

# 地区策略组
香港 = url-test, policy-regex-filter=(🇭🇰|香港|港|HKG|\bHK\b|Hong Kong|HongKong), url=http://cp.cloudflare.com/generate_204, interval=600, tolerance=100
台湾 = url-test, policy-regex-filter=(🇹🇼|台湾|臺灣|台北|台中|高雄|\bTW\b|Taipei|Taiwan), url=http://cp.cloudflare.com/generate_204, interval=600, tolerance=100
新加坡 = url-test, policy-regex-filter=(🇸🇬|新加坡|Singapore|\bSG\b|SGP), url=http://cp.cloudflare.com/generate_204, interval=600, tolerance=100
日本 = url-test, policy-regex-filter=(🇯🇵|日本|东京|大阪|埼玉|JP|Japan), url=http://cp.cloudflare.com/generate_204, interval=600, tolerance=100
韩国 = url-test, policy-regex-filter=(🇰🇷|韩国|韓國|首尔|首爾|\bKR\b|Korea), url=http://cp.cloudflare.com/generate_204, interval=600, tolerance=100
美国 = url-test, policy-regex-filter=(🇺🇸|美国|美國|洛杉矶|旧金山|西雅图|芝加哥|达拉斯|硅谷|United States|\bUSA\b|\bUS[-_ ]), url=http://cp.cloudflare.com/generate_204, interval=600, tolerance=100
英国 = url-test, policy-regex-filter=(🇬🇧|英国|英國|英格兰|英格蘭|London|United Kingdom|\bUK\b|\bGB\b|Britain|British), url=http://cp.cloudflare.com/generate_204, interval=600, tolerance=100

