  - domain_wildcard:
      match: '*.weixin.qq.com'
      value: Tencent
  - domain_wildcard:
      match: '*.wx.qq.com'
      value: Tencent
  - domain_wildcard:
      match: '*.weixin.com'
      value: Tencent
  - domain_wildcard:
      match: '*.wechat.com'
      value: Tencent
  - domain_wildcard:
      match: '*.servicewechat.com'
      value: Tencent
  - domain_wildcard:
      match: url.cn
      value: Tencent
  - domain_wildcard:
      match: '*.jd.com'
      value: Tencent
  - domain_wildcard:
      match: '*.tencent.com'
      value: Tencent
  - domain_wildcard:
      match: '*.bilibili.com'
      value: Tencent
  - domain_wildcard:
      match: hdslb.com
      value: Tencent
  - domain_wildcard:
      match: '*.163.com'
      value: Tencent
  - domain_wildcard:
      match: '*.126.com'
      value: Tencent
  - domain_wildcard:
      match: '*.126.net'
      value: Tencent
  - domain_wildcard:
      match: '*.127.net'
      value: Tencent
  - domain_wildcard:
      match: '*.netease.com'
      value: Tencent
  - domain_wildcard:
      match: '*.mi.com'
      value: Tencent
  - domain_wildcard:
      match: '*.xiaomi.com'
      value: Tencent
  - domain_wildcard:
      match: dl.google.com
      value: Tencent
  - domain_wildcard:
      match: dl.l.google.com
      value: Tencent
  - domain_wildcard:
      match: update.googleapis.com
      value: Tencent
  # 仓库规则集分流：大陆直连 -> 国内 DoH；Pre-AI/AI -> 跨境 DoH
  - proxy_rule_set:
      match: https://fastly.jsdelivr.net/gh/junchan0412/proxy-configs@main/surge/rules/direct-cn.list
      value: China
  - proxy_rule_set:
      match: https://fastly.jsdelivr.net/gh/junchan0412/proxy-configs@main/surge/rules/pre-ai-infra.list
      value: Global
  - proxy_rule_set:
      match: https://fastly.jsdelivr.net/gh/junchan0412/proxy-configs@main/surge/rules/ai-major.list
      value: Global
  - domain_wildcard:
      match: '*'
      value: China
  proxy_nameservers:
  - https://dns.alidns.com/dns-query
  - https://doh.pub/dns-query
  public_ip_lookup_url: https://ifconfig.me/ip

policy_groups:
# 节点订阅池：换成你自己的订阅地址（源配置的 Sub-Store 订阅池在公开版中为占位）
- external:
    name: 订阅池
    type: select
    urls:
    - https://example.com/replace-with-your-subscription
    update_interval: 3600
    hidden: true
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Available.png
- smart:
    name: 香港
    policies:
    - 订阅池
    flatten: true
    filter: '(🇭🇰|香港|港|虚通|HKG|\bHK\b|Hong Kong|HongKong)'
    interval: 300
    tolerance: 50
    latency_test_url: http://cp.cloudflare.com/generate_204
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/HK.png
- smart:
    name: 台湾
    policies:
    - 订阅池
    flatten: true
    filter: '(🇹🇼|台湾|臺灣|台北|台中|高雄|\bTW\b|Taipei|Taiwan)'
    interval: 300
    tolerance: 50
    latency_test_url: http://cp.cloudflare.com/generate_204
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/TW.png
- smart:
    name: 新加坡
    policies:
    - 订阅池
    flatten: true
    filter: '(🇸🇬|新加坡|Singapore|\bSG\b|SGP)'
    interval: 300
    tolerance: 50
    latency_test_url: http://cp.cloudflare.com/generate_204
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/SG.png
- smart:
    name: 日本
    policies:
    - 订阅池
    flatten: true
    filter: '(🇯🇵|日本|东京|大阪|埼玉|JP|Japan)'
    interval: 300
    tolerance: 50
    latency_test_url: http://cp.cloudflare.com/generate_204
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/JP.png
- smart:
    name: 韩国
    policies:
    - 订阅池
    flatten: true
    filter: '(🇰🇷|韩国|韓國|首尔|首爾|\bKR\b|Korea)'
    interval: 300
    tolerance: 50
    latency_test_url: http://cp.cloudflare.com/generate_204
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/KR.png
- smart:
    name: 美国
    policies:
    - 订阅池
    flatten: true
    filter: '(🇺🇸|美国|美國|美西|美东|美南|美北|洛杉矶|旧金山|圣何塞|西雅图|芝加哥|达拉斯|亚特兰大|硅谷|拉斯维加斯|波特兰|俄勒冈|凤凰城|费利蒙|圣克拉拉|United States|\bUSA\b|\bUS[-_ ])'
    interval: 300
    tolerance: 50
    latency_test_url: http://cp.cloudflare.com/generate_204
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/US.png
- smart:
    name: 英国
    policies:
    - 订阅池
    flatten: true
    filter: '(🇬🇧|英国|英國|英格兰|英格蘭|London|United Kingdom|\bUK\b|\bGB\b|Britain|British)'
    interval: 300
    tolerance: 50
    latency_test_url: http://cp.cloudflare.com/generate_204
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/UK.png
# Auto：只在区域组上优选，避免 订阅池->节点 的过深嵌套（同源配置）
- smart:
    name: Auto
    policies:
    - 香港
    - 台湾
    - 新加坡
    - 日本
    - 美国
    - 韩国
    flatten: false
    interval: 300
    tolerance: 50
    latency_test_url: http://cp.cloudflare.com/generate_204
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png
- select:
    name: PROXY
    policies:
    - Auto
    - 香港
    - 台湾
    - 新加坡
    - 日本
    - 美国
    - 韩国
    - 英国
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
- select:
    name: FINAL
    policies:
    - PROXY
    - DIRECT
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/World_Map.png
- select:
    name: 国际基础服务
    policies:
    - 新加坡
    - 美国
    - PROXY
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Global.png
- select:
    name: AI
    policies:
    - 台湾
    - 美国
    - 新加坡
    - PROXY
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/04ProxySoft/chatgpt4.0.png
- select:
    name: 国际社媒
    policies:
    - 新加坡
    - 美国
    - 台湾
    - PROXY
    icon: https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/apps/meta.png
- smart:
    name: Emby
    policies:
    - 订阅池
    flatten: true
    filter: '(?:🇭🇰|香港|港|Hong|HK|🇸🇬|新加坡|SG|Singapore|🇰🇷|韩国|韩|KR|Korea|🇹🇼|台湾|台|TW|Tai)'
    interval: 300
    tolerance: 50
    latency_test_url: http://cp.cloudflare.com/generate_204
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/04ProxySoft/emby.png
- select:
    name: Game
    policies:
    - 香港
    - 日本
    - 美国
    - 台湾
    - PROXY
    - DIRECT
    icon: https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/apps/Apple_GameCenter.png
- select:
    name: SpeedTest
    policies:
    - 香港
    - 新加坡
    - 美国
    - DIRECT
    icon: https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/04ProxySoft/01Country/US.png

rules:
# Part 1: 域名、进程与逻辑规则

# 0. 安全拦截与预匹配
- rule_set:
    match: 'https://fastly.jsdelivr.net/gh/dler-io/Rules@main/Surge/Surge%203/Provider/AdBlock.list'
    policy: REJECT

# 1. 自定义优先规则（iCloud 网关与 iCloud 规则）
- domain_suffix:
    match: gateway.icloud.com
    policy: DIRECT
- domain_suffix:
    match: gateway.icloud.com.cn
    policy: DIRECT
- domain_suffix:
    match: icloud.com
    policy: DIRECT
- domain_suffix:
    match: icloud.com.cn
    policy: DIRECT
- domain_suffix:
    match: apple-cloudkit.com
    policy: DIRECT
- rule_set:
    match: 'https://fastly.jsdelivr.net/gh/dler-io/Rules@main/Surge/Surge%203/Provider/Media/Apple%20Music.list'
    policy: DIRECT
# Pre-AI 共享基础设施保护（iCloud 规则）
- rule_set:
    match: 'https://fastly.jsdelivr.net/gh/junchan0412/proxy-configs@main/surge/rules/pre-ai-infra.list'
    policy: 国际基础服务
- rule_set:
    match: 'https://fastly.jsdelivr.net/gh/junchan0412/proxy-configs@main/surge/rules/ai-major.list'
    policy: AI
- rule_set:
    match: 'https://fastly.jsdelivr.net/gh/junchan0412/proxy-configs@main/surge/rules/direct-cn.list'
    policy: DIRECT

# 2. 本地、系统与局域网直连
- rule_set:
    match: 'https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Lan/Lan.list'
    policy: DIRECT
# 源配置的端口/组合逻辑规则（Egern 无等价项，由默认策略处理）: OR,((DEST-PORT,25), (DEST-PORT,110), (DEST-PORT,143), (DEST-PORT,465), (DEST-PORT,587)),DIRECT
# 源配置的端口/组合逻辑规则（Egern 无等价项，由默认策略处理）: AND,((OR,((DOMAIN,time-ios.apple.com), (DOMAIN,time.apple.com), (DOMAIN-SUFFIX,pool.ntp.org))), (DEST-PORT,123)),DIRECT

