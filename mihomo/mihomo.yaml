# Mihomo / Clash 公有完整配置模板
# 与 mihomo-override.yaml 保持同一套 DNS、sniffer、tun、策略组和分流规则。
# 公开版不包含节点、订阅链接、代理监听端口、外部控制器和 secret。
# 使用前请把 proxy-providers 中的示范 url 替换成你的 Mihomo / Clash 订阅链接。

unified-delay: true
geodata-mode: false
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24
tcp-concurrent: true
find-process-mode: strict

allow-lan: true
mode: rule
log-level: info
ipv6: false

proxies: []

# 锚点 - 节点订阅的参数 [每小时更新一次订阅节点，每 5 分钟一次惰性健康检查]
NodeParam: &NodeParam {type: http, interval: 3600, health-check: {enable: true, url: 'https://www.gstatic.com/generate_204', interval: 300, lazy: true}}

# 锚点 - 节点订阅
proxy-providers:
  # 将下面的 url 替换成你的机场 / 节点订阅链接即可直接使用；不用的示范项可以删除。
  # 策略组已启用 include-all-providers，会自动读取该订阅中的节点。
  机场一:
    url: 'https://example.com/replace-with-your-subscription-url-1'
    <<: *NodeParam
    path: './proxy_providers/airport-1.yaml'
    override:
      additional-prefix: '[机场一] '
  机场二:
    url: 'https://example.com/replace-with-your-subscription-url-2'
    <<: *NodeParam
    path: './proxy_providers/airport-2.yaml'
    override:
      additional-prefix: '[机场二] '
  机场三:
    url: 'https://example.com/replace-with-your-subscription-url-3'
    <<: *NodeParam
    path: './proxy_providers/airport-3.yaml'
    override:
      additional-prefix: '[机场三] '

geox-url:
  geoip: 'https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat'
  geosite: 'https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat'
  mmdb: 'https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/country.mmdb'
  asn: 'https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb'

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - +.v2ex.com

  skip-domain:
    - Mijia Cloud

tun:
  enable: true
  stack: system
  dns-hijack:
    - any:53
  auto-route: true
  auto-detect-interface: true

dns:
  enable: true
  prefer-h3: false
  respect-rules: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - +.lan
    - +.local
    - +.localdomain
    - localhost
    - '*.localhost'
    - '*.local'
    - '*.localdomain'
    - +.home.arpa
    - +.msftconnecttest.com
    - +.msftncsi.com
    - +.srv.nintendo.net
    - +.stun.playstation.net
    - +.stun.stunprotocol.org
    - +.stun.voip.blackberry.com
    - +.xboxlive.com
    - time.*.com
    - time.*.gov
    - time.*.edu.cn
    - time.*.apple.com
    - time1.*.com
    - time2.*.com
    - time3.*.com
    - time4.*.com
    - time5.*.com
    - time6.*.com
    - time7.*.com
    - +.apps.apple.com
    - +.itunes.apple.com
    - +.mzstatic.com
    - +.cdn-apple.com
    - +.aaplimg.com
    - +.ntp.org.cn
    - +.pool.ntp.org
  default-nameserver:
    - 223.5.5.5
    - 223.6.6.6
    - 119.29.29.29
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  direct-nameserver-follow-policy: false
  nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
    - tls://1.0.0.1:853
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
  nameserver-policy:
    "geosite:cn,private":
      - https://223.5.5.5/dns-query
      - https://doh.pub/dns-query
    "geosite:geolocation-!cn":
      - https://1.1.1.1/dns-query
      - https://8.8.8.8/dns-query

# 锚点 - 节点筛选组
FilterHK: &FilterHK '^(?=.*((?i)🇭🇰|香港|(\b(HK|HKG|Hong)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
FilterTW: &FilterTW '^(?=.*((?i)🇹🇼|台湾|(\b(TW|TWN|Tai|Taiwan)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
FilterJP: &FilterJP '^(?=.*((?i)🇯🇵|日本|东京|大阪|埼玉|(\b(JP|JPN|Japan)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
FilterKR: &FilterKR '^(?=.*((?i)🇰🇷|韩国|韓|首尔|(\b(KR|KOR|Korea)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
FilterSG: &FilterSG '^(?=.*((?i)🇸🇬|新加坡|狮|(\b(SG|SGP|Singapore)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
FilterUS: &FilterUS '^(?=.*((?i)🇺🇸|美国|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯维加斯|洛杉矶|圣何塞|圣克拉拉|西雅图|芝加哥|(\b(US|USA|United States)(\d+)?\b)))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$'
FilterAll: &FilterAll '^(?=.*(.))(?!.*((?i)群|邀请|返利|循环|官网|客服|网站|网址|获取|订阅|流量|到期|机场|下次|版本|官址|备用|过期|已用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|超时|收藏|福利|邀请|好友|失联|(\b(USE|USED|TOTAL|EXPIRE|EMAIL|Panel|Channel|Author|Traffic)(\d+)?\b|(\d{4}-\d{2}-\d{2}|\dG)))).*$'

# 策略组参数锚点
# 锚点 - 时延优选参数 [每 5 分钟一次惰性健康检查，容差 50ms，时延超过 5 秒判定为失败，失败 3 次则自动触发健康检查]
UrlTest: &UrlTest {type: url-test, interval: 300, tolerance: 50, lazy: true, url: 'https://www.gstatic.com/generate_204', disable-udp: false, timeout: 5000, max-failed-times: 3, hidden: true, include-all: true}
# 锚点 - 规则参数 [每天更新一次订阅规则]
RuleProviders: &RuleProviders {type: http, behavior: classical, interval: 86400, format: yaml}
TextRuleProviders: &TextRuleProviders {type: http, behavior: classical, interval: 86400, format: text}

# 策略组
proxy-groups:
  - {name: PROXY, type: select, include-all: true, filter: *FilterAll, proxies: [Auto, 香港, 新加坡, 台湾, 日本, 韩国, 美国, 英国, DIRECT], icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png'}
  - {name: Auto, <<: *UrlTest, filter: *FilterAll, hidden: false, icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Auto.png'}
  - {name: FINAL, type: select, proxies: [PROXY, DIRECT], icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/World_Map.png'}
  - {name: 国际基础服务, type: select, proxies: [新加坡, 美国, 香港, PROXY, DIRECT], icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Global.png'}
  - {name: Apple服务, type: select, proxies: [DIRECT, 国际基础服务, PROXY, 新加坡, 美国], icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Apple.png'}
  - {name: AI, type: select, proxies: [美国, 新加坡, 台湾, 日本, PROXY], icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/ChatGPT.png'}
  - {name: 国际社媒, type: select, proxies: [香港, 新加坡, 台湾, 日本, 美国, PROXY], icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Telegram.png'}
  - {name: Emby, <<: *UrlTest, filter: '^(?=.*((?i)🇭🇰|香港|港|Hong|HK|🇸🇬|新加坡|SG|Singapore|🇰🇷|韩国|韩|KR|Korea|🇹🇼|台湾|台|TW|Tai))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$', hidden: false, icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Streaming.png'}
  - {name: Game, type: select, proxies: [香港, 日本, 新加坡, 台湾, 韩国, 美国, PROXY, DIRECT], icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Game.png'}
  - {name: SpeedTest, type: select, proxies: [PROXY, Auto, 香港, 新加坡, 台湾, 日本, 韩国, 美国, 英国, DIRECT], icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Speedtest.png'}
  # 地区策略
  - {name: 香港, <<: *UrlTest, filter: *FilterHK, icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/HK.png'}
  - {name: 台湾, <<: *UrlTest, filter: *FilterTW, icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/TW.png'}
  - {name: 新加坡, <<: *UrlTest, filter: *FilterSG, icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/SG.png'}
  - {name: 日本, <<: *UrlTest, filter: *FilterJP, icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/JP.png'}
  - {name: 韩国, <<: *UrlTest, filter: *FilterKR, icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/KR.png'}
  - {name: 美国, <<: *UrlTest, filter: *FilterUS, icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/US.png'}
  - {name: 英国, <<: *UrlTest, filter: '^(?=.*((?i)🇬🇧|英国|英格兰|GBR|United Kingdom|UK|England|Britain|British))(?!.*((?i)回国|校园|游戏|🎮|(\b(GAME)\b))).*$', icon: 'https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/UK.png'}


