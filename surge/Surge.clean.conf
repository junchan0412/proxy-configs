# Reusable Surge profile template (generated from 根配置/Surge源配置.conf, desensitized).
# No node credentials, subscription URLs, local iCloud paths, CA material, or API passwords are included.
# Add proxies in [Proxy], or attach subscriptions in the Surge UI.

[General]
# 基础设置
loglevel = warning
ipv6 = false
ipv6-vif = auto
compatibility-mode = 1
# 17.0.0.0/8 保留：兼容性优先，部分 Apple 流量在系统层绕过引擎
skip-proxy = localhost, *.local, *.ts.net, captive.apple.com, guzzoni.apple.com, yunbusiness.ccb.com, www.abchina.com.cn, mobile-bank.psbc.com, login-service.mobile-bank.psbc.com, wxh.wo.cn, 0.0.0.0/8, 10.0.0.0/8, 17.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 192.88.99.0/24, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4, 255.255.255.255/32
exclude-simple-hostnames = true

# DNS 设置
# 国内 DoH 优先；补充 Cloudflare 作为跨境解析后备。follow-outbound 让加密 DNS 跟随出站策略。
dns-server = 223.5.5.5, 119.29.29.29
encrypted-dns-server = https://dns.alidns.com/dns-query, https://doh.pub/dns-query, https://cloudflare-dns.com/dns-query
hijack-dns = 8.8.8.8:53, 8.8.4.4:53, 1.1.1.1:53, 1.0.0.1:53, 45.14.70.14:53
encrypted-dns-follow-outbound-mode = true
include-all-networks = false
include-local-networks = false
encrypted-dns-skip-cert-verification = false

# 连通性测试（直连与代理使用不同探针，降低单一站点偏差）
internet-test-url = http://cp.cloudflare.com/generate_204
proxy-test-url = http://cp.cloudflare.com/generate_204
proxy-test-udp = apple.com@64.6.64.6
test-timeout = 5

# 局域网访问
allow-wifi-access = false
allow-hotspot-access = false
wifi-access-http-port = 6152
wifi-access-socks5-port = 6153
wifi-assist = true
all-hybrid = false
udp-priority = false

# 高级设置
show-error-page-for-reject = true
udp-policy-not-supported-behaviour = REJECT
proxy-restricted-to-lan = false
read-etc-hosts = true
# 完整 Country MMDB（支持 CN/SG/TW/HK/JP/KR/US 等 GEOIP 规则）
geoip-maxmind-url = https://raw.githubusercontent.com/Loyalsoldier/geoip/release/Country.mmdb
use-local-host-item-for-proxy = false
force-http-engine-hosts = *.ott.cibntv.net, 123.59.31.1, 119.18.193.135, 122.14.246.33, 175.102.178.52

# Raw TCP 与真实 IP
# Telegram 相关段与 IP 规则层对齐；real-ip 仅保留连通性/联机必要项
always-raw-tcp-hosts = 91.105.*, 91.108.*, 95.161.*, 149.154.*, 185.76.151.*, 5.28.195.*
always-real-ip = %APPEND% *.msftncsi.com, *.msftconnecttest.com, dns.msftncsi.com, *.stun.playstation.net, xbox.*.microsoft.com, *.xboxlive.com, *.srv.nintendo.net, *.stun.twilio.com, *.turn.twilio.com, time.*.com, time.*.gov, time.*.edu.cn, time.*.apple.com, time?.*.com, ntp.*.com, ntp?.*.com, *.time.edu.cn, *.ntp.org.cn, *.pool.ntp.org, time*.cloud.tencent.com, ntp?.aliyun.com

[Proxy]
# Add your own nodes here, or manage subscriptions in the Surge UI.

[Proxy Group]
# 入口策略组
# Auto 只在区域组上 smart，避免 Auto -> 订阅池 -> 节点 的过深嵌套
PROXY = select, Auto, 香港, 台湾, 新加坡, 日本, 美国, 韩国, 英国, no-alert=0, hidden=0, include-all-proxies=0, icon-url=B1::Maps::Earth Globe
Auto = smart, hidden=0, url=http://cp.cloudflare.com/generate_204, interval=600, tolerance=100, no-alert=1, include-all-proxies=0, include-other-group="香港, 台湾, 新加坡, 日本, 美国, 韩国", policy-priority=(🇭🇰|香港|港|Hong|HK):0.70;(🇸🇬|新加坡|SG|Singapore):0.80;(🇹🇼|台湾|台|TW|Tai):0.90;(🇯🇵|日本|JP|Japan|东京|大阪):0.95, icon-url=B1::Photo and Video::Flash Auto
# FINAL：DNS 失败时仍落到本兜底组（PROXY/DIRECT），便于排障而非直接 REJECT
FINAL = select, PROXY, DIRECT, no-alert=0, hidden=0, include-all-proxies=0, icon-url=B1::User Interface::Final State

# 业务策略组
国际基础服务 = select, 新加坡, 美国, PROXY, no-alert=0, hidden=0, include-all-proxies=0, icon-url=B1::Logos::Google Cloud
AI = select, 台湾, 美国, 新加坡, PROXY, no-alert=1, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/04ProxySoft/chatgpt4.0.png
# 国际社媒：海外通信 + 视频类社媒（原“国际社区”）
国际社媒 = select, 新加坡, 美国, 台湾, PROXY, url=http://cp.cloudflare.com/generate_204, interval=600, tolerance=100, no-alert=0, hidden=0, persistent=1, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/apps/meta.png
Emby = smart, url=http://cp.cloudflare.com/generate_204, interval=600, tolerance=50, no-alert=1, hidden=0, include-all-proxies=0, policy-priority=(🇭🇰|香港|港|Hong|HK):0.70;(🇸🇬|新加坡|SG|Singapore):0.80;(🇰🇷|韩国|韩|KR|Korea|South Korea):0.90;(🇹🇼|台湾|台|TW|Tai):0.95, icon-url=https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/04ProxySoft/emby.png, include-all-proxies=0
Game = select, 香港, 日本, 美国, 台湾, PROXY, DIRECT, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/apps/Apple_GameCenter.png
SpeedTest = select, 香港, 新加坡, 美国, DIRECT, no-alert=0, hidden=0, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/lige47/QuanX-icon-rule/main/icon/01Country/US.png

# 过滤条件保持既有严格策略（信息类节点 + 常见域名噪声）
新加坡 = smart, policy-regex-filter=(🇸🇬|新加坡|Singapore|\bSG\b|SGP), url=http://cp.cloudflare.com/generate_204, interval=600, tolerance=100, include-all-proxies=0, hidden=1, no-alert=1, include-all-proxies=0, icon-url=EMOJI::🇸🇬

# 区域策略组（统一 url/interval/tolerance；regex 收紧避免误匹配）
日本 = smart, policy-regex-filter=(🇯🇵|日本|东京|大阪|埼玉|JP|Japan), url=http://cp.cloudflare.com/generate_204, interval=600, tolerance=100, include-all-proxies=0, hidden=1, no-alert=1, include-all-proxies=0, icon-url=EMOJI::🇯🇵
香港 = smart, policy-regex-filter=(🇭🇰|香港|港|虚通|HKG|\bHK\b|Hong Kong|HongKong), url=http://cp.cloudflare.com/generate_204, interval=600, tolerance=100, include-all-proxies=0, hidden=1, no-alert=1, include-all-proxies=0, icon-url=EMOJI::🇭🇰, persistent=1
台湾 = smart, policy-regex-filter=(🇹🇼|台湾|臺灣|台北|台中|高雄|\bTW\b|Taipei|Taiwan), url=http://cp.cloudflare.com/generate_204, interval=600, tolerance=100, include-all-proxies=0, hidden=1, no-alert=1, include-all-proxies=0, icon-url=https://raw.githubusercontent.com/fmz200/wool_scripts/main/icons/flag/TW_01.png
韩国 = smart, policy-regex-filter=(🇰🇷|韩国|韓國|首尔|首爾|\bKR\b|Korea), url=http://cp.cloudflare.com/generate_204, interval=600, tolerance=100, include-all-proxies=0, hidden=1, no-alert=1, include-all-proxies=0, icon-url=EMOJI::🇰🇷
美国 = smart, policy-regex-filter=(🇺🇸|美国|美國|美西|美东|美南|美北|洛杉矶|旧金山|圣何塞|西雅图|芝加哥|达拉斯|亚特兰大|硅谷|拉斯维加斯|波特兰|俄勒冈|凤凰城|费利蒙|圣克拉拉|United States|\bUSA\b|\bUS[-_ ]), url=http://cp.cloudflare.com/generate_204, interval=600, tolerance=100, include-all-proxies=0, hidden=1, no-alert=1, include-all-proxies=0, icon-url=EMOJI::🇺🇸
英国 = smart, policy-regex-filter=(🇬🇧|英国|英國|英格兰|英格蘭|London|United Kingdom|\bUK\b|\bGB\b|Britain|British), url=http://cp.cloudflare.com/generate_204, interval=600, tolerance=100, include-all-proxies=0, hidden=1, no-alert=1, include-all-proxies=0, icon-url=EMOJI::🇬🇧
